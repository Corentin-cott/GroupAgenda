services:
  web:
    build:
      context: .
      args:
        EXPO_PUBLIC_POCKETBASE_URL: ${EXPO_PUBLIC_POCKETBASE_URL:?URL PocketBase manquante}
        EXPO_PUBLIC_APP_URL: ${EXPO_PUBLIC_APP_URL:?URL publique du site manquante}
    image: groupagenda-web:latest
    container_name: groupagenda-web
    restart: unless-stopped

    # Exposé sur la boucle locale uniquement : c'est le reverse proxy du VPS qui termine le TLS et publie le service.
    ports:
      - "127.0.0.1:8093:80"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
