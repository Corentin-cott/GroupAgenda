# Via une variable : un add_header dans un location annule ceux du serveur.
map $uri $groupagenda_cache {
    default               "no-cache, must-revalidate";
    "~^/(_expo|assets)/"  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Cache-Control $groupagenda_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Deep links : fichiers réels, jamais le repli SPA.
    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    # 404 plutôt que de renvoyer du HTML à la place du JS.
    location ~ ^/(_expo|assets)/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
